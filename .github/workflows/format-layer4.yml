name: Format Layer 4
on:
  push:
    branches:
      - fix/typecheck-lint-cleanup
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/typecheck-lint-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/routes/api/p2p/signal.ts src/routes/api/p2p/token.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/p2p/signal.ts src/routes/api/p2p/token.ts
          git commit -m "chore: format p2p routes" || exit 0
          git push origin HEAD:fix/typecheck-lint-cleanup
