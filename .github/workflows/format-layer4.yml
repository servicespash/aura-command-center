name: Format Layer 4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/typecheck-lint-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/aura/AccessGate.tsx src/components/aura/FlightTrackingHUD.tsx src/components/aura/MapLibreCanvas.tsx src/components/aura/OnboardDomainModal.tsx src/lib/CommandRegistry.ts src/services/auth/providerAuth.ts src/services/aviation/publicFlightRecords.ts src/services/p2p/security.ts src/services/p2p/signaling.ts src/store/sessionLedgerStore.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/aura/AccessGate.tsx src/components/aura/FlightTrackingHUD.tsx src/components/aura/MapLibreCanvas.tsx src/components/aura/OnboardDomainModal.tsx src/lib/CommandRegistry.ts src/services/auth/providerAuth.ts src/services/aviation/publicFlightRecords.ts src/services/p2p/security.ts src/services/p2p/signaling.ts src/store/sessionLedgerStore.ts
          git commit -m "chore: format Layer 4 implementation" || exit 0
          git push origin HEAD:fix/typecheck-lint-cleanup
