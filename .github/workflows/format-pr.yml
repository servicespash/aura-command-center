name: Format PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npx prettier --write src/agent/index.ts src/agent/protocol.ts src/components/aura/AccessGate.tsx src/components/aura/CommandDeck.tsx src/components/aura/FlightFeedModule.tsx src/components/aura/FlightTrackingHUD.tsx src/components/aura/FloatingHUD.tsx src/components/aura/LayoutAuditOverlay.tsx src/components/aura/MapLayer.tsx src/components/aura/MapLibreCanvas.tsx src/components/aura/ThreatHeatmap.tsx src/components/aura/data.ts src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/chart.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/engine/osint/aviation.ts src/lib/AudioEngine.ts src/lib/CommandRegistry.ts src/lib/EgressRouter.ts src/lib/EvidencePipeline.ts src/lib/LayoutAuditor.ts src/services/runtime/agentClient.ts src/services/runtime/agentTelemetry.ts src/services/runtime/index.ts src/services/runtime/telemetryIngest.ts src/services/security/serverAuth.ts src/store/telemetryStore.ts

      - name: Commit formatting changes
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/agent/index.ts src/agent/protocol.ts src/components/aura/AccessGate.tsx src/components/aura/CommandDeck.tsx src/components/aura/FlightFeedModule.tsx src/components/aura/FlightTrackingHUD.tsx src/components/aura/FloatingHUD.tsx src/components/aura/LayoutAuditOverlay.tsx src/components/aura/MapLayer.tsx src/components/aura/MapLibreCanvas.tsx src/components/aura/ThreatHeatmap.tsx src/components/aura/data.ts src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/chart.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/engine/osint/aviation.ts src/lib/AudioEngine.ts src/lib/CommandRegistry.ts src/lib/EgressRouter.ts src/lib/EvidencePipeline.ts src/lib/LayoutAuditor.ts src/services/runtime/agentClient.ts src/services/runtime/agentTelemetry.ts src/services/runtime/index.ts src/services/runtime/telemetryIngest.ts src/services/security/serverAuth.ts src/store/telemetryStore.ts
            git commit -m "style: apply Prettier formatting"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Formatting is already clean."
          fi
